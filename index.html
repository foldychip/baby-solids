<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2437">
<title>Little Bites — Baby Solids Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- Dark baby header -->
  <header class="appbar">
    <div class="baby-id">
      <div class="baby-avatar" id="babyAvatar">👶</div>
      <div>
        <div class="baby-name" id="babyNameTop">Baby</div>
        <div class="baby-age" id="babyAgeTop">just starting solids</div>
      </div>
    </div>
    <div class="stat-chips">
      <button class="stat-chip sync" id="syncBtn" title="Cloud sync">☁️<span id="syncState"></span></button>
    </div>
  </header>

  <!-- Medical disclaimer -->
  <div class="disclaimer" id="disclaimer">
    <strong>⚠️ Not medical advice.</strong> General guidance (AAP-style). Confirm the food list, amounts, and
    especially allergen timing with <strong>your pediatrician</strong>, and watch for any reaction.
    <button id="dismissDisc" class="link-btn">Got it</button>
  </div>

  <main id="main"></main>

  <!-- Bottom tab bar -->
  <nav class="bottom-nav">
    <button class="bnav active" data-tab="home"><span class="bi">🏠</span><span>Home</span></button>
    <button class="bnav" data-tab="foods"><span class="bi">🥑</span><span>Foods</span></button>
    <button class="bnav" data-tab="plan"><span class="bi">🍽️</span><span>Plan</span></button>
    <button class="bnav" data-tab="tracker"><span class="bi">📈</span><span>Tracker</span></button>
  </nav>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
